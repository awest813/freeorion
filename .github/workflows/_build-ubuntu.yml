name: "Ubuntu"

on:
  workflow_call:

jobs:
  ubuntu:
    name: "${{ matrix.os }} with ${{ matrix.compiler }} (parsers: ${{ matrix.build-parsers }}, asan: ${{ matrix.asan }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
        compiler: [gcc, clang]
        client-godot: ["4"]
        build-parsers: ["ON"]
        asan: [false]
        include:
          - os: ubuntu-26.04
            compiler: gcc
            client-godot: "4"
            build-parsers: "ON"
            asan: true
          - os: ubuntu-26.04
            compiler: clang
            client-godot: "4"
            build-parsers: "ON"
            asan: true
          - os: ubuntu-24.04
            compiler: gcc
            client-godot: "4"
            build-parsers: "OFF"
            asan: false
    env:
      CACHE_NAME: linux
      BUILD_TYPE: ${{ matrix.asan && 'RelWithDebInfo' || 'Release' }}
    steps:
      - name: Set compiler environment variables
        run: |
          MATRIX_KEY="${{ matrix.os }}:${{ matrix.compiler }}"
          case "$MATRIX_KEY" in
            "ubuntu-24.04:gcc")
              echo "CC=gcc-14" >> $GITHUB_ENV
              echo "CXX=g++-14" >> $GITHUB_ENV
              ;;
            "ubuntu-26.04:gcc")
              echo "CC=gcc-15" >> $GITHUB_ENV
              echo "CXX=g++-15" >> $GITHUB_ENV
              ;;
            "ubuntu-24.04:clang")
              echo "CC=clang-18" >> $GITHUB_ENV
              echo "CXX=clang++-18" >> $GITHUB_ENV
              ;;
            "ubuntu-26.04:clang")
              echo "CC=clang-22" >> $GITHUB_ENV
              echo "CXX=clang++-22" >> $GITHUB_ENV
              ;;
            *)
              echo "::error::Unsupported combination of OS and compiler: $MATRIX_KEY"
              exit 1
              ;;
          esac

          EXTRA_CFLAGS=""
          EXTRA_LDFLAGS=""
          if [ "${{ matrix.asan }}" = "true" ]; then
            EXTRA_CFLAGS="${EXTRA_CFLAGS:+$EXTRA_CFLAGS }-fsanitize=address -g"
            EXTRA_LDFLAGS="-fsanitize=address"
            if [ "${{ matrix.compiler }}" = "clang" ]; then
              EXTRA_LDFLAGS="${EXTRA_LDFLAGS:+$EXTRA_LDFLAGS }-shared-libasan"
            fi
          fi
          [ -n "$EXTRA_CFLAGS" ] && echo "CFLAGS=$EXTRA_CFLAGS" >> $GITHUB_ENV
          [ -n "$EXTRA_CFLAGS" ] && echo "CXXFLAGS=$EXTRA_CFLAGS" >> $GITHUB_ENV
          [ -n "$EXTRA_LDFLAGS" ] && echo "LDFLAGS=$EXTRA_LDFLAGS" >> $GITHUB_ENV
          exit 0
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: build-ubuntu-install-cache-id
        with:
          path: ${{ runner.temp }}/cache-build-linux-install
          key: build-${{ matrix.os }}-install-cache-key-v1.0
      - uses: airvzxf/cache-anything-new-action@v1.0.1
        with:
          script: '${{ matrix.os }}-install-build.sh'
          is_cached: ${{ steps.build-ubuntu-install-cache-id.outputs.cache-hit }}
          cache: ${{ runner.temp }}/cache-build-linux-install
          snapshot: '/'
          exclude: '/boot /data /dev /mnt /proc /run /sys'
      - name: Prepare ccache timestamp
        id: build-ubuntu-ccache-timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}")
      - name: Cache files with ccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.asan }}-ccache-${{ steps.build-ubuntu-ccache-timestamp.outputs.timestamp }}
          restore-keys: |
            build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.asan }}-ccache-
      - name: Configure ccache
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --set-config=sloppiness=file_macro,time_macros
      - name: Show ccache statistics before build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --show-stats || true
      - name: Build directory
        run: mkdir build
      - name: Configure
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          cd build
          cmake -DBUILD_TESTING=ON -DBUILD_CLIENT_GG=ON -DBUILD_CLIENT_GODOT=${{ matrix.client-godot }} -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_PARSERS=${{ matrix.build-parsers }} ..
      - name: Build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: |
          cd build
          cmake --build .
      - name: Show ccache statistics after build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --show-stats || true
      - name: Run C++ unit tests
        env:
          FO_TEST_HOSTLESS_GAMES: 1
          ASAN_OPTIONS: ${{ matrix.asan && 'detect_leaks=0:abort_on_error=1' || ''}}
        run: |
          if [ "${{ matrix.asan }}" = "true" ] && [ "${{ matrix.compiler }}" = "clang" ]; then
            export LD_PRELOAD=$($CC -print-file-name=libclang_rt.asan-x86_64.so)
          fi
          cd build
          cmake --build . --config $BUILD_TYPE --target unittest
      - name: Install Godot 4
        if: matrix.client-godot == '4' && matrix.build-parsers == 'ON'
        run: |
          GODOT_VERSION=$(cat godot4/.godot-version)
          curl -sSLo godot4.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot4.zip -d build/
          mv "build/Godot_v${GODOT_VERSION}-stable_linux.x86_64" build/godot4
      - name: Run Godot unit tests
        if: matrix.client-godot == '4' && matrix.build-parsers == 'ON'
        env:
          ASAN_OPTIONS: ${{ matrix.asan && 'detect_leaks=0:abort_on_error=1' || ''}}
        run: |
          echo "::group::Import Godot 4 project"
          ./build/godot4 --headless --import --path godot4
          echo "::endgroup::"
          if [ "${{ matrix.asan }}" = "true" ]; then
            if [ "${{ matrix.compiler }}" = "clang" ]; then
              export LD_PRELOAD=$($CC -print-file-name=libclang_rt.asan-x86_64.so)
            else
              export LD_PRELOAD=$($CC -print-file-name=libasan.so)
            fi
          fi
          echo "::group::Test Godot 4 project"
          ./build/godot4 --headless --verbose -s --path godot4 addons/gut/gut_cmdln.gd -gdir=res://test/ -ginclude_subdirs -gexit 2>&1 | tee godot4_test_output.log
          echo "::endgroup::"
          if grep -E "ERROR:|Missing class_names:" godot4_test_output.log; then
            echo "::error::Godot completed with code 0, but execution errors occurred!"
            exit 1
          fi
      - name: Run Godot visual tests
        # Goldens in godot4/test/visual/golden were rendered with Mesa llvmpipe on Ubuntu 24.04.
        # Regenerate them with UPDATE_GOLDENS=1 when a change is intended.
        if: matrix.client-godot == '4' && matrix.build-parsers == 'ON' && matrix.os == 'ubuntu-24.04' && matrix.compiler == 'gcc' && !matrix.asan
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1280x800x24" ./build/godot4 --rendering-driver opengl3 --resolution 1280x800 -s --path godot4 addons/gut/gut_cmdln.gd -gdir=res://test/visual -gexit 2>&1 | tee godot4_visual_output.log
          if grep -E "SCRIPT ERROR|Parse Error|\[Failed\]" godot4_visual_output.log; then
            echo "::error::Godot visual tests failed"
            exit 1
          fi
      - name: Upload Godot visual test failures
        if: failure() && matrix.os == 'ubuntu-24.04' && matrix.compiler == 'gcc' && !matrix.asan
        uses: actions/upload-artifact@v7
        with:
          name: godot4-visual-failures-${{ github.run_number }}
          path: ~/.local/share/godot/app_userdata/FreeOrion Godot 4 Client/visual/
          if-no-files-found: ignore
          retention-days: 7
